name: keirin-cross-source-audit

on:
  workflow_dispatch:
  schedule:
    # Monday 03:30 JST
    - cron: "30 18 * * 0"

permissions:
  contents: write

concurrency:
  group: keirin-cross-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore central history
        id: central
        uses: actions/cache/restore@v4
        with:
          path: data/raw/history.csv
          key: keirin-central-history-v1-${{ github.run_id }}
          restore-keys: |
            keirin-central-history-v1-

      - name: Restore weekly history fallback
        if: steps.central.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: data/raw/history.csv
          key: keirin-history-v4-${{ github.run_id }}
          restore-keys: |
            keirin-history-v4-

      - name: Cross-check 200 unaudited historical races
        run: |
          test -s data/raw/history.csv
          python src/cross_source_audit.py --max-races 200 --candidate-pool 5000

      - name: Publish audit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/cross_source_audit_results.csv outputs/cross_source_audit_summary.json
          git diff --staged --quiet && exit 0
          git commit -m "Update cross-source history audit"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin main; then
              exit 0
            fi
            git rebase --abort || true
            echo "cross-source audit push race: retry $attempt/4"
            sleep $((attempt * 2))
          done
          exit 1
