name: keirin-cross-source-audit

on:
  workflow_dispatch:
  schedule:
    # Monday 03:30 JST
    - cron: "30 18 * * 0"

permissions:
  contents: write

concurrency:
  group: keirin-cross-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore central history
        id: central
        uses: actions/cache/restore@v4
        with:
          path: data/raw/history.csv
          key: keirin-central-history-v1-${{ github.run_id }}
          restore-keys: |
            keirin-central-history-v1-

      - name: Validate restored central history
        id: central_gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import pandas as pd

          p = Path("data/raw/history.csv")
          races = 0
          usable = False
          if p.exists() and p.stat().st_size:
              try:
                  df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
                  races = int(df["race_id"].nunique())
                  usable = races >= 30000
              except Exception as exc:
                  print(f"central history validation failed: {exc}")
          print(f"races={races}")
          print(f"usable={'true' if usable else 'false'}")
          if not usable and p.exists():
              p.unlink()
              print(f"removed undersized central history races={races}")
          PY

      - name: Restore strict validation history fallback
        id: strict_history
        if: steps.central_gate.outputs.usable != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/history.csv
            data/raw/history_odds.csv
            data/raw/history_trifecta_odds.csv
            data/raw/history_metadata.json
            data/raw/race_cache
          key: keirin-v4-validation-${{ github.run_id }}
          restore-keys: |
            keirin-v4-validation-

      - name: Validate strict history fallback
        id: strict_gate
        if: steps.central_gate.outputs.usable != 'true'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import pandas as pd

          p = Path("data/raw/history.csv")
          races = 0
          usable = False
          if p.exists() and p.stat().st_size:
              try:
                  df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
                  races = int(df["race_id"].nunique())
                  usable = races >= 30000
              except Exception as exc:
                  print(f"strict history validation failed: {exc}")
          print(f"races={races}")
          print(f"usable={'true' if usable else 'false'}")
          if not usable and p.exists():
              p.unlink()
              print(f"removed undersized strict history races={races}")
          PY

      - name: Restore weekly history fallback
        if: steps.central_gate.outputs.usable != 'true' && steps.strict_gate.outputs.usable != 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/raw/history.csv
          key: keirin-history-v4-${{ github.run_id }}
          restore-keys: |
            keirin-history-v4-

      - name: Validate final audit history
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          p = Path("data/raw/history.csv")
          if not p.exists() or not p.stat().st_size:
              raise SystemExit("audit history missing")
          df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
          races = int(df["race_id"].nunique())
          print(f"audit history races={races}")
          if races < 30000:
              raise SystemExit(f"audit history too small: {races}")
          PY

      - name: Cross-check 200 unaudited historical races
        run: |
          test -s data/raw/history.csv
          python src/cross_source_audit.py --max-races 200 --candidate-pool 5000

      - name: Publish audit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/cross_source_audit_results.csv outputs/cross_source_audit_summary.json
          git diff --staged --quiet && exit 0
          git commit -m "Update cross-source history audit"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin main; then
              exit 0
            fi
            git rebase --abort || true
            echo "cross-source audit push race: retry $attempt/4"
            sleep $((attempt * 2))
          done
          exit 1
