name: temporary-company-learning-smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-company-learning-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/company-learning-loop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and run company learning layer
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile src/company_knowledge.py
          python src/company_knowledge.py --mode manual
          test -s outputs/company/central_history_manifest.json
          test -s outputs/company/data_department.json
          test -s outputs/company/pace_department.json
          test -s outputs/company/line_department.json
          test -s outputs/company/risk_department.json
          test -s outputs/company/strategist_brief.json
          test -s outputs/company/third_party_audit.json
          test -s outputs/company/ceo_decision_support.json
          test -s outputs/company/executive_directive.json
          test -s outputs/company/secretary_digest.md

      - name: Print validation summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ["central_history_manifest.json", "ceo_decision_support.json", "third_party_audit.json"]:
              p = Path("outputs/company") / name
              print(name, json.loads(p.read_text(encoding="utf-8")))
          PY
