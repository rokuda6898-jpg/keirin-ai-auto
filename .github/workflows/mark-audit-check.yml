name: Prediction and department coverage tests

on:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight audit dependencies
        run: python -m pip install numpy pandas beautifulsoup4
      - name: Compile integration modules
        run: python -m py_compile src/mark_performance.py src/department_coverage.py src/annual_knowledge.py src/site_manager.py src/predict.py src/settle_results.py src/public_performance.py
      - name: Test prospective-only mark accuracy
        run: python -m unittest discover -s tests -p 'test_mark_performance.py' -v
      - name: Test every-race and seven-department forecast coverage
        run: python -m unittest discover -s tests -p 'test_department_coverage.py' -v
      - name: Audit checked-in real race snapshot for false integrity alarms
        run: |
          PYTHONPATH=src python - <<'PY'
          from site_manager import audit_entries, audit_site_output
          entries, _ = audit_entries()
          site = audit_site_output()
          bad = [p for p in entries + site
                 if p.get("type") in {"missing_riders", "site_player_name_mismatch"}]
          print(f"Race source incidents: {len(entries)}, site incidents: {len(site)}")
          print(f"Unresolved entry/identity incidents: {len(bad)}")
          if bad:
              print("Examples:", bad[:5])
              raise SystemExit(1)
          PY
