name: conditional-trifecta-live
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/conditional_live.py', 'src/trifecta_chain_research.py', 'models/conditional_trifecta_v1.*', '.github/workflows/conditional-live.yml']
  schedule:
    - cron: '13,43 * * * *'
  workflow_run:
    workflows: ['daily-keirin-predict', 'intraday-keirin-odds', 'quick-keirin-results', 'settle-keirin-results']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: conditional-trifecta-live
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-conditional.txt
      - run: pip install -r requirements-conditional.txt
      - name: Check model, freeze every upcoming race, join official results
        id: forecast
        continue-on-error: true
        env:
          PYTHONPATH: src
          OMP_NUM_THREADS: '2'
        run: python src/conditional_live.py
      - name: Publish the isolated ledger and coverage, including any missing forecasts
        run: |
          test -s outputs/conditional_live.json
          test -f outputs/company/conditional_live_ledger.jsonl
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/conditional_live.json outputs/company/conditional_live_ledger.jsonl
          git diff --cached --quiet && exit 0
          git commit -m 'Update conditional trifecta forecasts and results'
          for attempt in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main || exit 1
          done
          exit 1
      - name: Fail visibly when any upcoming forecast is missing
        if: steps.forecast.outcome != 'success'
        run: exit 1
