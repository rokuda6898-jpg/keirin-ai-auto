name: settle-keirin-results

on:
  workflow_dispatch:
  schedule:
    # During the racing day, settle official results every 15 minutes.
    # GitHub Actions cron is UTC: 00:00-14:59 UTC = 09:00-23:59 JST.
    - cron: "*/15 0-14 * * *"
    # Final catch-up after the day's racing.
    - cron: "30 14 * * *"

permissions:
  contents: write

concurrency:
  # Settlement keeps its own queue. GitHub only retains one pending run per
  # concurrency group, so sharing the generic writer queue could evict a
  # scheduled settlement before it ever starts.
  group: keirin-settle-results-v2
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore latest intraday central history
        id: central_history
        uses: actions/cache/restore@v4
        with:
          path: data/raw/history.csv
          key: keirin-central-history-v1-${{ github.run_id }}
          restore-keys: |
            keirin-central-history-v1-

      - name: Validate restored central history baseline
        id: central_gate
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd

          p = Path("data/raw/history.csv")
          usable = False
          races = 0
          if p.exists() and p.stat().st_size:
              try:
                  df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
                  races = int(df["race_id"].nunique())
                  usable = races >= 30000
              except Exception as exc:
                  print(f"central baseline validation failed: {exc}")

          print({"restored_central_races": races, "usable": usable})
          if not usable and p.exists():
              p.unlink()
              print("removed undersized central history so validated fallback can restore cleanly")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"usable={'true' if usable else 'false'}\n")
              fh.write(f"races={races}\n")
          PY

      - name: Bootstrap central history from strict validation cache
        id: strict_history
        if: steps.central_gate.outputs.usable != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/history.csv
            data/raw/history_odds.csv
            data/raw/history_trifecta_odds.csv
            data/raw/history_metadata.json
            data/raw/race_cache
          key: keirin-v4-validation-${{ github.run_id }}
          restore-keys: |
            keirin-v4-validation-

      - name: Validate strict history fallback
        id: strict_gate
        if: steps.central_gate.outputs.usable != 'true'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import pandas as pd

          p = Path("data/raw/history.csv")
          races = 0
          usable = False
          if p.exists() and p.stat().st_size:
              try:
                  df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
                  races = int(df["race_id"].nunique())
                  usable = races >= 30000
              except Exception as exc:
                  print(f"strict fallback validation failed: {exc}")
          print(f"races={races}")
          print(f"usable={'true' if usable else 'false'}")
          if not usable and p.exists():
              p.unlink()
              print(f"removed undersized strict fallback races={races}")
          PY

      - name: Bootstrap central history from accumulated weekly cache
        if: steps.central_gate.outputs.usable != 'true' && steps.strict_gate.outputs.usable != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/history.csv
            data/raw/history_odds.csv
            data/raw/history_trifecta_odds.csv
            data/raw/history_metadata.json
            data/raw/race_cache
          key: keirin-history-v4-${{ github.run_id }}
          restore-keys: |
            keirin-history-v4-

      - name: Refresh today entries for result URLs
        continue-on-error: true
        run: |
          python src/fetch_today_entries.py

      - name: Settle predictions
        run: |
          python src/settle_results.py

      - name: Append officially confirmed races to central history
        id: append_history
        run: |
          python src/append_confirmed_history.py --min-existing-races 30000

      - name: Save latest intraday central history
        if: steps.append_history.outcome == 'success' && hashFiles('data/raw/history.csv') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw/history.csv
          key: keirin-central-history-v1-${{ github.run_id }}

      - name: Update company knowledge after central history is persisted
        run: |
          python src/company_knowledge.py --mode settle

      - name: Rebuild historical prediction history on manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          python src/rebuild_prediction_history.py

      - name: Append settlement growth log
        run: |
          python src/update_growth_log.py --kind settle

      - name: Settle all shadow predictions
        run: |
          python src/settle_shadow.py

      - name: Update trial report
        run: |
          python src/report_growth.py --days 31 --start-date 2026-07-01

      - name: Upload settlement artifact
        uses: actions/upload-artifact@v4
        with:
          name: keirin-settlement
          path: |
            outputs/purchase_plan.csv
            outputs/settled_bets.csv
            outputs/settlement_summary.csv
            outputs/japanese_report.md
            outputs/prediction_history.csv
            outputs/history.html
            outputs/growth_log.csv
            outputs/trial_report.md
            outputs/company/
            outputs/shadow_race_results.csv
            outputs/shadow_settled_bets.csv
            outputs/shadow_daily_summary.csv
            outputs/shadow_bet_type_summary.csv
            outputs/shadow_strategy_summary.csv
            outputs/shadow_overall.json
            outputs/shadow_report.md
            models/
          retention-days: 30

      - name: Commit settlement
        timeout-minutes: 10
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only publish generated artifacts. Central history is persisted by
          # the cache step above and must not block or race the live writers.
          git add models outputs || true

          if git diff --staged --quiet; then
            echo "no settlement changes to publish"
          else
            git commit -m "Settle keirin predictions"
          fi

          # Other workflows update main frequently during racing hours.
          # Never rerun the full settlement pipeline inside the push step:
          # merge the newest main in seconds, keep this settlement snapshot on
          # direct conflicts, then retry the push.
          git restore --worktree . || true
          git clean -fd

          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main

            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit -X ours origin/main
            fi

            # -X ours must not discard concurrent frozen predictions/outcomes
            # or publish an aggregate built before those records arrived.
            python src/reconcile_position_experiment.py --ref origin/main
            git add outputs/company/annual_position_experiment*
            git diff --staged --quiet || git commit -m "Reconcile prospective position evidence"

            if git push origin HEAD:main; then
              echo "settlement published"
              exit 0
            fi

            echo "settlement push race; fast merge retry $attempt/8"
            sleep 2
          done

          echo "settlement publish failed after bounded retries"
          exit 1
