name: deploy-pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'src/build_public_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:
  schedule:
    # Full original reports refresh hourly; live cards still fetch data directly.
    - cron: '7 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public app
        run: |
          node --check site/app.js
          node --check site/archive.js
          test -s site/index.html
          test -s site/style.css
      - name: Include the complete original company and history pages
        run: python src/build_public_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-build
      - uses: actions/deploy-pages@v4
        id: deployment
