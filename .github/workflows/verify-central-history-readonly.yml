name: persist-central-history-once

on:
  push:
    paths:
      - ".github/workflows/verify-central-history-readonly.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore strict validated central baseline
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/history.csv
            data/raw/history_odds.csv
            data/raw/history_trifecta_odds.csv
            data/raw/history_metadata.json
            data/raw/race_cache
          key: central-bootstrap-from-validation-${{ github.run_id }}
          restore-keys: |
            keirin-v4-validation-

      - name: Verify validated baseline
        run: |
          test -s data/raw/history.csv
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("data/raw/history.csv", dtype={"race_id": str, "player_id": str})
          races = int(df["race_id"].nunique())
          rows = int(len(df))
          print({"before_rows": rows, "before_races": races})
          if races < 45000:
              raise SystemExit(f"validated baseline too small: {races}")
          PY

      - name: Refresh today entries
        run: python src/fetch_today_entries.py

      - name: Append confirmed races to validated baseline
        run: python src/append_confirmed_history.py --min-existing-races 45000

      - name: Verify final central history
        run: |
          cat outputs/central_history_append_summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("outputs/central_history_append_summary.json").read_text())
          if int(d["history_races"]) < int(d["history_races_before"]):
              raise SystemExit("central history regressed")
          if int(d["history_races_before"]) < 45000:
              raise SystemExit("baseline guard failed")
          PY

      - name: Persist verified central history
        uses: actions/cache/save@v4
        with:
          path: data/raw/history.csv
          key: keirin-central-history-v1-${{ github.run_id }}

      - name: Upload verification summary
        uses: actions/upload-artifact@v4
        with:
          name: central-history-persist-verification
          path: outputs/central_history_append_summary.json
          retention-days: 1
