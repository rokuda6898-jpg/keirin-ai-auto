name: keirin-live-snapshot-learning

on:
  workflow_dispatch:
  schedule:
    # Every 10 minutes from 07:00 through 23:59 JST.
    - cron: "*/10 22-23,0-14 * * *"

permissions:
  contents: read

concurrency:
  group: keirin-live-snapshot-learning
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore real pre-race learning snapshots
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/live_snapshot_history.csv
            data/raw/live_feature_base.csv
          key: keirin-live-snapshots-v1-${{ github.run_id }}
          restore-keys: |
            keirin-live-snapshots-v1-

      - name: Restore central history for live features
        id: live_central_history
        uses: actions/cache/restore@v4
        with:
          path: data/raw/history.csv
          key: keirin-central-history-v1-${{ github.run_id }}
          restore-keys: |
            keirin-central-history-v1-

      - name: Validate restored central history
        id: live_central_gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import pandas as pd

          p = Path("data/raw/history.csv")
          races = 0
          usable = False
          if p.exists() and p.stat().st_size:
              try:
                  df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
                  races = int(df["race_id"].nunique())
                  usable = races >= 30000
              except Exception as exc:
                  print(f"central history validation failed: {exc}")
          print(f"races={races}")
          print(f"usable={'true' if usable else 'false'}")
          if not usable and p.exists():
              p.unlink()
              print(f"removed undersized central history races={races}")
          PY
          echo "restored central races: ${{ steps.live_central_gate.outputs.races }}"

      - name: Restore strict validation history fallback
        id: live_strict_history
        if: steps.live_central_gate.outputs.usable != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/history.csv
            data/raw/history_odds.csv
            data/raw/history_trifecta_odds.csv
            data/raw/history_metadata.json
            data/raw/race_cache
          key: keirin-v4-validation-${{ github.run_id }}
          restore-keys: |
            keirin-v4-validation-

      - name: Validate strict validation history fallback
        id: live_strict_gate
        if: steps.live_central_gate.outputs.usable != 'true'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import pandas as pd

          p = Path("data/raw/history.csv")
          races = 0
          usable = False
          if p.exists() and p.stat().st_size:
              try:
                  df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
                  races = int(df["race_id"].nunique())
                  usable = races >= 30000
              except Exception as exc:
                  print(f"strict fallback validation failed: {exc}")
          print(f"races={races}")
          print(f"usable={'true' if usable else 'false'}")
          if not usable and p.exists():
              p.unlink()
              print(f"removed undersized strict fallback races={races}")
          PY

      - name: Restore weekly history fallback
        if: steps.live_central_gate.outputs.usable != 'true' && steps.live_strict_gate.outputs.usable != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/history.csv
            data/raw/history_odds.csv
            data/raw/history_trifecta_odds.csv
            data/raw/history_metadata.json
            data/raw/race_cache
          key: keirin-history-v4-${{ github.run_id }}
          restore-keys: |
            keirin-history-v4-

      - name: Validate final live feature history
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          p = Path("data/raw/history.csv")
          if not p.exists() or not p.stat().st_size:
              raise SystemExit("validated history fallback missing")
          df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
          races = int(df["race_id"].nunique())
          print(f"validated live feature history races={races}")
          if races < 30000:
              raise SystemExit(f"validated history still too small: {races}")
          PY

      - name: Refresh only races inside the learning window
        id: upcoming
        run: |
          python src/fetch_upcoming_entries.py --min-minutes 5 --max-minutes 45 --retry-sec 3
          echo "count=$(cat data/raw/upcoming_races_count.txt)" >> "$GITHUB_OUTPUT"

      - name: Capture 40m 20m 10m real-feed snapshots
        if: steps.upcoming.outputs.count != '0'
        run: |
          python src/live_snapshot_store.py --capture

      - name: Save real pre-race learning snapshots
        if: steps.upcoming.outputs.count != '0' && hashFiles('data/raw/live_snapshot_history.csv') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw/live_snapshot_history.csv
          key: keirin-live-snapshots-v1-${{ github.run_id }}
