name: keirin-fast-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/fast-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/fast-ci.yml"

permissions:
  contents: read

concurrency:
  group: keirin-fast-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and run unit tests
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -p "test_*.py"
      - name: Verify checked-in race and rider identity snapshot
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from site_manager import audit_entries, audit_site_output
          entries, _ = audit_entries()
          site = audit_site_output()
          important = [p for p in entries + site if p["type"] in {
              "missing_riders", "site_player_name_mismatch"
          }]
          print({"entry_problems": len(entries), "site_problems": len(site),
                 "critical_identity": important[:5]})
          if important:
              raise SystemExit(1)
          PY
      - name: Diagnose committed market snapshot without saving predictions
        env:
          PYTHONPATH: src
        run: python src/market_axis_shadow.py --diagnose --output-dir "$RUNNER_TEMP/market-axis-diagnostics"
      - name: Preserve market diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-axis-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/market-axis-diagnostics/company/
          if-no-files-found: warn
          retention-days: 7
