name: inspect Gamboo public decisive method tables

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/gamboo_probe.py
      - .github/workflows/gamboo-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python src/gamboo_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gamboo-table-probe
          path: research/gamboo_probe/probe.json
          retention-days: 7
          if-no-files-found: warn
