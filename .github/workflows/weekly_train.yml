name: weekly-keirin-train
# manual retrain trigger after verified 50,018-race central history

on:
  workflow_dispatch:
  push:
    paths:
      - "src/train.py"
      - "src/train_top1_candidate.py"
      - "src/multi_bet_backtest.py"
      - "src/predict.py"
      - "src/race_features.py"
      - "src/settle_results.py"
      - "src/company_knowledge.py"
      - "tests/**"
      - ".github/workflows/weekly_train.yml"
  schedule:
    # Monday 05:30 JST
    - cron: "30 20 * * 0"

permissions:
  contents: write

concurrency:
  # Keep long model training isolated from the 10-minute site-manager queue.
  # GitHub keeps only one pending run per concurrency group, so sharing the
  # writer group caused scheduled manager runs to cancel a waiting retrain.
  group: keirin-weekly-train
  # A newer training definition/model change must supersede an older run.
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore accumulated history cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw/history.csv
            data/raw/history_odds.csv
            data/raw/history_trifecta_odds.csv
            data/raw/history_metadata.json
            data/raw/race_cache
          key: keirin-history-v4-${{ github.run_id }}
          restore-keys: |
            keirin-history-v4-

      - name: Restore latest intraday central history
        uses: actions/cache/restore@v4
        with:
          path: data/raw/history.csv
          key: keirin-central-history-v1-${{ github.run_id }}
          restore-keys: |
            keirin-central-history-v1-

      - name: Validate source and tests
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -p "test_*.py"

      - name: Ingest external data if configured
        env:
          KEIRIN_HISTORY_CSV_URL: ${{ secrets.KEIRIN_HISTORY_CSV_URL }}
          KEIRIN_TODAY_CSV_URL: ${{ secrets.KEIRIN_TODAY_CSV_URL }}
        run: |
          python src/ingest.py

      - name: Refresh real history only if central history is incomplete
        env:
          KEIRIN_HISTORY_CSV_URL: ${{ secrets.KEIRIN_HISTORY_CSV_URL }}
          HISTORY_MONTHS_BACK: 24
          HISTORY_MAX_RACES: 9000
          HISTORY_MIN_RACES: 7000
          HISTORY_SAMPLE_MOD: 4
          HISTORY_WORKERS: 8
          WINTICKET_MIN_REQUEST_INTERVAL_SEC: 0.25
        run: |
          if [ -n "$KEIRIN_HISTORY_CSV_URL" ]; then
            echo "KEIRIN_HISTORY_CSV_URL is configured; skip WINTICKET history build"
            exit 0
          fi

          python - <<'PY' > /tmp/history_floor.txt
          import json
          import pandas as pd
          from pathlib import Path

          p = Path("data/raw/history.csv")
          races = 0
          if p.exists() and p.stat().st_size:
              df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
              races = int(df["race_id"].nunique())

          audited = 0
          summary = Path("models/v4_validation_summary.json")
          if summary.exists():
              try:
                  audited = int(json.loads(summary.read_text(encoding="utf-8")).get("total_history_races") or 0)
              except Exception:
                  audited = 0

          minimum = max(30000, int(audited * 0.95))
          print(races, minimum)
          PY

          read CURRENT_RACES MINIMUM_RACES < /tmp/history_floor.txt
          echo "central history races: $CURRENT_RACES"
          echo "required floor: $MINIMUM_RACES"

          if [ "$CURRENT_RACES" -ge "$MINIMUM_RACES" ]; then
            echo "Central history is already sufficient; skip expensive historical refetch."
            exit 0
          fi

          HISTORY_SAMPLE_OFFSET=$(( GITHUB_RUN_NUMBER % HISTORY_SAMPLE_MOD ))
          echo "central history incomplete; rebuilding shard ${HISTORY_SAMPLE_OFFSET}/${HISTORY_SAMPLE_MOD}"
          python src/build_history.py --months-back "$HISTORY_MONTHS_BACK" --max-races "$HISTORY_MAX_RACES" --min-races "$HISTORY_MIN_RACES" --sample-mod "$HISTORY_SAMPLE_MOD" --sample-offset "$HISTORY_SAMPLE_OFFSET" --merge-existing --workers "$HISTORY_WORKERS" --sleep-sec 0 --progress-every 250

      - name: Save merged central history for intraday settlement
        if: always() && hashFiles('data/raw/history.csv') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw/history.csv
          key: keirin-central-history-v1-${{ github.run_id }}

      - name: Verify history integrity
        run: |
          if [ -s data/raw/history_odds.csv ]; then
            python src/audit_history.py --fail-on-leakage
          else
            echo "history odds are external or unavailable; skip entry-count audit"
          fi

      - name: Check accumulated history size
        id: history_gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import pandas as pd
          from pathlib import Path

          p = Path("data/raw/history.csv")
          races = 0
          if p.exists() and p.stat().st_size:
              df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
              races = int(df["race_id"].nunique())

          # Never retrain on a shrunken cache. The strict V4 validation summary
          # is our last audited large-history reference; require at least 95%
          # of that race count, with an absolute floor of 30,000 races.
          audited_races = 0
          summary = Path("models/v4_validation_summary.json")
          if summary.exists():
              try:
                  audited_races = int(json.loads(summary.read_text(encoding="utf-8")).get("total_history_races") or 0)
              except Exception:
                  audited_races = 0
          minimum_races = max(30000, int(audited_races * 0.95))
          print(f"races={races}")
          print(f"minimum_races={minimum_races}")
          print(f"ready={'true' if races >= minimum_races else 'false'}")
          PY
          echo "Accumulated history races: ${{ steps.history_gate.outputs.races }}"
          echo "Required history floor: ${{ steps.history_gate.outputs.minimum_races }}"

      - name: Update company knowledge
        run: |
          python src/company_knowledge.py --mode weekly

      - name: Train top1 candidate first
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          python src/train_top1_candidate.py

      - name: Preserve fast top1 candidate
        if: steps.history_gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: keirin-top1-candidate-${{ github.run_id }}
          path: |
            models/candidate_win_model.joblib
            models/candidate_fast_metrics.json
          retention-days: 30

      - name: Train
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          cp models/win_model.joblib /tmp/production_win_model.joblib
          cp models/metrics.json /tmp/production_metrics.json
          python src/train.py
          cp models/win_model.joblib models/candidate_win_model.joblib
          cp models/metrics.json models/candidate_metrics.json

      - name: Keep production model when history is incomplete
        if: steps.history_gate.outputs.ready != 'true'
        run: |
          echo "History has only ${{ steps.history_gate.outputs.races }} races."
          echo "Skip retraining. Keep the validated production model unchanged."
          echo "The accumulated cache will be preserved for the next run."

      - name: Append training growth log
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          python src/update_growth_log.py --kind train

      - name: Run multi bet type backtest
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          python src/multi_bet_backtest.py --min-train-dates 30 --retrain-every-days 7 --top-k 5 --min-prob 0.02 --min-expected-profit 100 --max-odds 300 --max-bets-per-race-type 2 --max-bets-per-day-type 40 --base-stake 100 --max-stake 500
          python src/update_growth_log.py --kind multi_bet_backtest

      - name: Restore gated production model
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          cp /tmp/production_win_model.joblib models/win_model.joblib
          cp /tmp/production_metrics.json models/metrics.json

      - name: Promote candidate only if external gate passes
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path
          p = Path("models/candidate_promotion.json")
          if not p.exists():
              raise SystemExit(1)
          d = json.loads(p.read_text(encoding="utf-8"))
          raise SystemExit(0 if d.get("promotion_gate", {}).get("target_passed") else 1)
          PY
          then
            cp models/candidate_win_model.joblib models/win_model.joblib
            cp models/candidate_metrics.json models/metrics.json
            echo "Candidate promoted to production."
          else
            echo "Candidate failed external promotion gate. Production remains unchanged."
          fi

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: keirin-model
          path: |
            models/
            outputs/backtest_summary.csv
            outputs/backtest_summary.json
            outputs/latest_backtest.csv
            outputs/growth_log.csv
            outputs/multi_bet_backtest_bets.csv
            outputs/multi_bet_backtest_summary.csv
            outputs/multi_bet_backtest_overall.json
            outputs/multi_bet_backtest_report.md
            outputs/multi_bet_period_summary.csv
            outputs/multi_bet_threshold_sweep.csv
            outputs/multi_bet_recommended_conditions_periods.csv
            outputs/company/
          retention-days: 30

      - name: Commit model and backtest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models outputs || true
          git diff --staged --quiet || git commit -m "Update keirin model and backtest"
          # Generated history/cache steps can leave tracked files modified outside the intended commit.
          # Clean the worktree after committing the intended artifacts so rebase is always allowed.
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            git rebase --abort || true
            echo "weekly train push race: retry $attempt/4"
            sleep 2
          done
          exit 1
