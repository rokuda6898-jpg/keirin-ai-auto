name: weekly-keirin-train
# manual retrain trigger after verified 50,018-race central history

on:
  workflow_dispatch:
  push:
    paths:
      - "src/train.py"
      - "src/common.py"
      - "src/train_top1_candidate.py"
      - "src/train_recency_challenger.py"
      - "src/production_replay_backtest.py"
      - "src/trifecta_reranker.py"
      - "src/train_trifecta_reranker.py"
      - "src/commander_selector.py"
      - "src/train_commander_selector.py"
      - "src/live_snapshot_store.py"
      - "src/live_snapshot_model.py"
      - "src/train_live_snapshot_model.py"
      - "src/build_production_feature_baseline.py"
      - "src/model_drift_audit.py"
      - "src/multi_bet_backtest.py"
      - "src/predict.py"
      - "src/race_features.py"
      - "src/settle_results.py"
      - "src/company_knowledge.py"
      - "tests/**"
      - ".github/workflows/weekly_train.yml"
  schedule:
    # Monday 05:30 JST
    - cron: "30 20 * * 0"

permissions:
  contents: write

concurrency:
  # Keep long model training isolated from the 10-minute site-manager queue.
  # GitHub keeps only one pending run per concurrency group, so sharing the
  # writer group caused scheduled manager runs to cancel a waiting retrain.
  group: keirin-weekly-train
  # A newer training definition/model change must supersede an older run.
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore accumulated history cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw/history.csv
            data/raw/history_odds.csv
            data/raw/history_trifecta_odds.csv
            data/raw/history_metadata.json
            data/raw/race_cache
          key: keirin-history-v4-${{ github.run_id }}
          restore-keys: |
            keirin-history-v4-

      - name: Preserve accumulated weekly history candidate
        run: |
          if [ -s data/raw/history.csv ]; then
            cp data/raw/history.csv /tmp/weekly_history_candidate.csv
          fi

      - name: Restore latest intraday central history
        uses: actions/cache/restore@v4
        with:
          path: data/raw/history.csv
          key: keirin-central-history-v1-${{ github.run_id }}
          restore-keys: |
            keirin-central-history-v1-

      - name: Merge weekly and central history candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          candidates = []
          for path in [
              Path("/tmp/weekly_history_candidate.csv"),
              Path("data/raw/history.csv"),
          ]:
              if path.exists() and path.stat().st_size:
                  try:
                      frame = pd.read_csv(
                          path,
                          dtype={"race_id": str, "player_id": str},
                      )
                      if not frame.empty and "race_id" in frame.columns:
                          candidates.append(frame)
                          print(
                              f"history candidate {path}: "
                              f"rows={len(frame)} races={frame['race_id'].nunique()}"
                          )
                  except Exception as exc:
                      print(f"history candidate read failed {path}: {exc}")

          if not candidates:
              raise SystemExit("no usable history candidate restored")

          merged = pd.concat(candidates, ignore_index=True, sort=False)
          key = ["race_id"]
          if "player_id" in merged.columns:
              key.append("player_id")
          elif "car_no" in merged.columns:
              key.append("car_no")
          merged = merged.drop_duplicates(key, keep="last")
          Path("data/raw").mkdir(parents=True, exist_ok=True)
          merged.to_csv("data/raw/history.csv", index=False)
          print(
              f"merged history rows={len(merged)} "
              f"races={merged['race_id'].nunique()}"
          )
          PY

      - name: Restore real pre-race learning snapshots
        uses: actions/cache/restore@v4
        with:
          path: data/raw/live_snapshot_history.csv
          key: keirin-live-snapshots-v1-${{ github.run_id }}
          restore-keys: |
            keirin-live-snapshots-v1-

      - name: Validate source and tests
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -p "test_*.py"

      - name: Ingest external data if configured
        env:
          KEIRIN_HISTORY_CSV_URL: ${{ secrets.KEIRIN_HISTORY_CSV_URL }}
          KEIRIN_TODAY_CSV_URL: ${{ secrets.KEIRIN_TODAY_CSV_URL }}
        run: |
          python src/ingest.py

      - name: Refresh real history only if central history is incomplete
        env:
          KEIRIN_HISTORY_CSV_URL: ${{ secrets.KEIRIN_HISTORY_CSV_URL }}
          HISTORY_MONTHS_BACK: 24
          HISTORY_MAX_RACES: 9000
          HISTORY_MIN_RACES: 7000
          HISTORY_SAMPLE_MOD: 4
          HISTORY_WORKERS: 8
          WINTICKET_MIN_REQUEST_INTERVAL_SEC: 0.25
        run: |
          if [ -n "$KEIRIN_HISTORY_CSV_URL" ]; then
            echo "KEIRIN_HISTORY_CSV_URL is configured; skip WINTICKET history build"
            exit 0
          fi

          python - <<'PY' > /tmp/history_floor.txt
          import json
          import pandas as pd
          from pathlib import Path

          p = Path("data/raw/history.csv")
          races = 0
          if p.exists() and p.stat().st_size:
              df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
              races = int(df["race_id"].nunique())

          audited = 0
          summary = Path("models/v4_validation_summary.json")
          if summary.exists():
              try:
                  audited = int(json.loads(summary.read_text(encoding="utf-8")).get("total_history_races") or 0)
              except Exception:
                  audited = 0

          minimum = max(30000, int(audited * 0.95))
          print(races, minimum)
          PY

          read CURRENT_RACES MINIMUM_RACES < /tmp/history_floor.txt
          echo "central history races: $CURRENT_RACES"
          echo "required floor: $MINIMUM_RACES"

          if [ "$CURRENT_RACES" -ge "$MINIMUM_RACES" ]; then
            echo "Central history is already sufficient; skip expensive historical refetch."
            exit 0
          fi

          HISTORY_SAMPLE_OFFSET=$(( GITHUB_RUN_NUMBER % HISTORY_SAMPLE_MOD ))
          echo "central history incomplete; rebuilding shard ${HISTORY_SAMPLE_OFFSET}/${HISTORY_SAMPLE_MOD}"
          python src/build_history.py --months-back "$HISTORY_MONTHS_BACK" --max-races "$HISTORY_MAX_RACES" --min-races "$HISTORY_MIN_RACES" --sample-mod "$HISTORY_SAMPLE_MOD" --sample-offset "$HISTORY_SAMPLE_OFFSET" --merge-existing --workers "$HISTORY_WORKERS" --sleep-sec 0 --progress-every 250

      - name: Validate central history before cache publish
        id: central_cache_gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import pandas as pd

          p = Path("data/raw/history.csv")
          races = 0
          if p.exists() and p.stat().st_size:
              try:
                  df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
                  races = int(df["race_id"].nunique())
              except Exception as exc:
                  print(f"central cache validation failed: {exc}")
          ready = races >= 30000
          print(f"races={races}")
          print(f"ready={'true' if ready else 'false'}")
          PY
          echo "central cache candidate races: ${{ steps.central_cache_gate.outputs.races }}"

      - name: Save merged central history for intraday settlement
        if: steps.central_cache_gate.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/raw/history.csv
          key: keirin-central-history-v1-${{ github.run_id }}

      - name: Verify history integrity
        run: |
          if [ -s data/raw/history_odds.csv ]; then
            python src/audit_history.py --fail-on-leakage
          else
            echo "history odds are external or unavailable; skip entry-count audit"
          fi

      - name: Check accumulated history size
        id: history_gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import pandas as pd
          from pathlib import Path

          p = Path("data/raw/history.csv")
          races = 0
          if p.exists() and p.stat().st_size:
              df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
              races = int(df["race_id"].nunique())

          # Never retrain on a shrunken cache. The strict V4 validation summary
          # is our last audited large-history reference; require at least 95%
          # of that race count, with an absolute floor of 30,000 races.
          audited_races = 0
          summary = Path("models/v4_validation_summary.json")
          if summary.exists():
              try:
                  audited_races = int(json.loads(summary.read_text(encoding="utf-8")).get("total_history_races") or 0)
              except Exception:
                  audited_races = 0
          minimum_races = max(30000, int(audited_races * 0.95))
          print(f"races={races}")
          print(f"minimum_races={minimum_races}")
          print(f"ready={'true' if races >= minimum_races else 'false'}")
          PY
          echo "Accumulated history races: ${{ steps.history_gate.outputs.races }}"
          echo "Required history floor: ${{ steps.history_gate.outputs.minimum_races }}"

      - name: Label real pre-race learning snapshots
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          python src/live_snapshot_store.py --label

      - name: Save labeled real pre-race learning snapshots
        if: steps.history_gate.outputs.ready == 'true' && hashFiles('data/raw/live_snapshot_history.csv') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw/live_snapshot_history.csv
          key: keirin-live-snapshots-v1-labeled-${{ github.run_id }}

      - name: Update company knowledge
        run: |
          python src/company_knowledge.py --mode weekly

      - name: Build drift baseline for current production model
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          python src/build_production_feature_baseline.py

      - name: Train top1 candidate first
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          python src/train_top1_candidate.py

      - name: Train recency-weighted Top1 challenger
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          python src/train_recency_challenger.py --half-life-days 120

      - name: Preserve fast top1 candidate
        if: steps.history_gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: keirin-top1-candidate-${{ github.run_id }}
          path: |
            models/candidate_win_model.joblib
            models/candidate_fast_metrics.json
          retention-days: 30

      - name: Train
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          cp models/win_model.joblib /tmp/production_win_model.joblib
          cp models/metrics.json /tmp/production_metrics.json
          python src/train.py
          cp models/win_model.joblib models/candidate_win_model.joblib
          cp models/metrics.json models/candidate_metrics.json

      - name: Keep production model when history is incomplete
        if: steps.history_gate.outputs.ready != 'true'
        run: |
          echo "History has only ${{ steps.history_gate.outputs.races }} races."
          echo "Skip retraining. Keep the validated production model unchanged."
          echo "The accumulated cache will be preserved for the next run."

      - name: Append training growth log
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          python src/update_growth_log.py --kind train

      - name: Run multi bet type backtest
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          python src/multi_bet_backtest.py --min-train-dates 30 --retrain-every-days 7 --top-k 5 --min-prob 0.02 --min-expected-profit 100 --max-odds 300 --max-bets-per-race-type 2 --max-bets-per-day-type 40 --base-stake 100 --max-stake 500
          python src/update_growth_log.py --kind multi_bet_backtest

      - name: Run production-logic chronological replay
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          python src/production_replay_backtest.py --eval-races 8000 --folds 3 --min-train-races 15000

      - name: Train shadow trifecta combination reranker
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          python src/train_trifecta_reranker.py --min-races 1500

      - name: Train shadow commander selector
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          python src/train_commander_selector.py

      - name: Refresh company after engine lab validation
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          python src/company_knowledge.py --mode weekly

      - name: Restore gated production model
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          cp /tmp/production_win_model.joblib models/win_model.joblib
          cp /tmp/production_metrics.json models/metrics.json

      - name: Promote candidate only if external gate passes
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path
          p = Path("models/candidate_promotion.json")
          if not p.exists():
              raise SystemExit(1)
          d = json.loads(p.read_text(encoding="utf-8"))
          raise SystemExit(0 if d.get("promotion_gate", {}).get("target_passed") else 1)
          PY
          then
            cp models/candidate_win_model.joblib models/win_model.joblib
            cp models/candidate_metrics.json models/metrics.json
            if [ -f models/candidate_feature_baseline.json ]; then
              cp models/candidate_feature_baseline.json models/feature_baseline.json
            fi
            echo "Candidate promoted to production with matching drift baseline."
          else
            echo "Candidate failed external promotion gate. Production remains unchanged."
          fi

      - name: Train real-snapshot Top1 shadow model
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          python src/train_live_snapshot_model.py --min-races 500

      - name: Refresh company after live-snapshot model
        if: steps.history_gate.outputs.ready == 'true'
        run: |
          python src/company_knowledge.py --mode weekly

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: keirin-model
          path: |
            models/
            outputs/backtest_summary.csv
            outputs/backtest_summary.json
            outputs/latest_backtest.csv
            outputs/growth_log.csv
            outputs/multi_bet_backtest_bets.csv
            outputs/multi_bet_backtest_summary.csv
            outputs/multi_bet_backtest_overall.json
            outputs/multi_bet_backtest_report.md
            outputs/multi_bet_period_summary.csv
            outputs/multi_bet_threshold_sweep.csv
            outputs/multi_bet_recommended_conditions_periods.csv
            outputs/production_replay_summary.json
            outputs/production_replay_folds.csv
            outputs/production_replay_races.csv
            outputs/live_snapshot_learning_summary.json
            outputs/company/
          retention-days: 30

  publish:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Keep weekly publication in its own queue. Publication safety is handled
      # by explicit staleness checks and latest-main reapplication below.
      group: keirin-weekly-publish
      cancel-in-progress: false

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download trained model and reports
        uses: actions/download-artifact@v4
        with:
          name: keirin-model
          path: /tmp/weekly-artifact

      - name: Publish model and backtest safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          artifact=/tmp/weekly-artifact

          guarded_paths=(
            src/train.py
            src/common.py
            src/train_top1_candidate.py
            src/train_recency_challenger.py
            src/production_replay_backtest.py
            src/trifecta_reranker.py
            src/train_trifecta_reranker.py
            src/commander_selector.py
            src/train_commander_selector.py
            src/live_snapshot_store.py
            src/live_snapshot_model.py
            src/train_live_snapshot_model.py
            src/model_drift_audit.py
            src/build_production_feature_baseline.py
            src/multi_bet_backtest.py
            src/predict.py
            src/race_features.py
            src/settle_results.py
            src/company_knowledge.py
            src/update_growth_log.py
            src/build_history.py
            src/audit_history.py
            tests
            .github/workflows/weekly_train.yml
            models
          )

          weekly_model_files=(
            win_model.joblib
            metrics.json
            candidate_win_model.joblib
            candidate_metrics.json
            candidate_fast_metrics.json
            candidate_promotion.json
            position_models.joblib
            position_metrics.json
            shadow_rank_model.joblib
            recency_win_model.joblib
            recency_model_metrics.json
            feature_baseline.json
            trifecta_reranker.joblib
            trifecta_reranker_metrics.json
            commander_selector.joblib
            commander_selector_metrics.json
            live_snapshot_win_model.joblib
            live_snapshot_model_metrics.json
          )

          weekly_output_files=(
            backtest_summary.csv
            backtest_summary.json
            latest_backtest.csv
            multi_bet_backtest_bets.csv
            multi_bet_backtest_summary.csv
            multi_bet_backtest_overall.json
            multi_bet_backtest_report.md
            multi_bet_period_summary.csv
            multi_bet_threshold_sweep.csv
            multi_bet_recommended_conditions_periods.csv
            production_replay_summary.json
            production_replay_folds.csv
            production_replay_races.csv
            live_snapshot_learning_summary.json
          )

          weekly_source_is_stale() {
            git fetch origin main
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- "${guarded_paths[@]}"; then
              echo "Weekly training became stale while running; refusing model/backtest publication."
              git diff --name-only "$GITHUB_SHA" origin/main -- "${guarded_paths[@]}" || true
              return 0
            fi
            return 1
          }

          apply_weekly_artifact_on_latest_main() {
            git fetch origin main

            if weekly_source_is_stale; then
              return 10
            fi

            company_changed=false
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- outputs/company; then
              company_changed=true
              echo "Company knowledge advanced during training; preserve latest main company state."
            fi

            git reset --hard origin/main
            git clean -fd

            mkdir -p models outputs
            for name in "${weekly_model_files[@]}"; do
              if [ -f "$artifact/models/$name" ]; then
                cp -f "$artifact/models/$name" "models/$name"
              fi
            done

            for name in "${weekly_output_files[@]}"; do
              if [ -f "$artifact/outputs/$name" ]; then
                cp -f "$artifact/outputs/$name" "outputs/$name"
              fi
            done

            # growth_log.csv is append-only and is also updated by settlement.
            # Merge both versions so weekly publication never deletes newer
            # settlement rows.
            if [ -f "$artifact/outputs/growth_log.csv" ]; then
              python - <<'PY'
          from pathlib import Path
          import pandas as pd

          current = Path("outputs/growth_log.csv")
          weekly = Path("/tmp/weekly-artifact/outputs/growth_log.csv")
          frames = []
          for path in (current, weekly):
              if path.exists() and path.stat().st_size:
                  try:
                      frames.append(pd.read_csv(path))
                  except Exception as exc:
                      print(f"growth log read warning: {path}: {exc}")
          if frames:
              merged = pd.concat(frames, ignore_index=True, sort=False).drop_duplicates(keep="last")
              merged.to_csv(current, index=False)
              print(f"merged growth log rows={len(merged)}")
          PY
            fi

            # Company knowledge is shared with settlement. Only copy the weekly
            # snapshot when no newer company state landed during training.
            if [ "$company_changed" = "false" ] && [ -d "$artifact/outputs/company" ]; then
              mkdir -p outputs/company
              cp -R "$artifact/outputs/company/." outputs/company/
            fi

            git add models outputs || true
            git diff --staged --quiet || git commit -m "Update keirin model and backtest"
            return 0
          }

          if apply_weekly_artifact_on_latest_main; then
            :
          else
            rc=$?
            [ "$rc" -eq 10 ] && exit 0
            exit "$rc"
          fi

          for attempt in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            echo "weekly publish push race: reapply artifact on latest main retry $attempt/4"
            if apply_weekly_artifact_on_latest_main; then
              :
            else
              rc=$?
              [ "$rc" -eq 10 ] && exit 0
              exit "$rc"
            fi
            sleep $((attempt * 2))
          done
          exit 1
