name: verify-central-history-once
# trigger: run once

on:
  push:
    paths:
      - ".github/workflows/verify-central-history-once.yml"

permissions:
  contents: write

concurrency:
  group: keirin-repo-writer
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore latest intraday central history
        id: central_history
        uses: actions/cache/restore@v4
        with:
          path: data/raw/history.csv
          key: keirin-central-history-v1-${{ github.run_id }}
          restore-keys: |
            keirin-central-history-v1-

      - name: Bootstrap from weekly history cache
        if: steps.central_history.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/history.csv
            data/raw/history_odds.csv
            data/raw/history_trifecta_odds.csv
            data/raw/history_metadata.json
            data/raw/race_cache
          key: keirin-history-v4-${{ github.run_id }}
          restore-keys: |
            keirin-history-v4-

      - name: Refresh today entries
        run: |
          python src/fetch_today_entries.py

      - name: Append confirmed races
        run: |
          python src/append_confirmed_history.py

      - name: Save verified central history cache
        if: always() && hashFiles('data/raw/history.csv') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw/history.csv
          key: keirin-central-history-v1-${{ github.run_id }}

      - name: Commit verification summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/central_history_append_summary.json
          git diff --staged --quiet && exit 0
          git commit -m "Verify central history append"
          git pull --rebase origin main
          git push
