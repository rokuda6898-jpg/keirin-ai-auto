name: nexus-formation-publish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/nexus_model/**', 'src/nexus_publish.py', 'models/nexus53/**', 'tests/test_nexus.py', '.github/workflows/nexus.yml']
permissions:
  contents: read
concurrency:
  group: nexus-formation-verify
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install numpy==2.4.2 lightgbm==4.7.0 requests
      - name: Validate formation, money and exact model assets
        run: python -m unittest discover -s tests -p 'test_nexus*.py'
      - name: Load the saved model without accessing the restricted data source
        env:
          PYTHONPATH: src
        run: python -c "from nexus_model.engine import Engine; print('Loaded',len(Engine('models/nexus53').models),'verified models')"
# Data collection and publishing run on the owner's existing local PC.
# The source rejects overseas CI; no proxy or access-restriction bypass is used.