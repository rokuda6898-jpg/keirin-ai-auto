name: nexus-formation-publish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/nexus_model/**', 'src/nexus_*.py', 'src/conditional_budget_near_close.py', 'src/conditional_roi.py', 'models/nexus53/**', 'tests/test_nexus*.py', 'tests/test_conditional_budget_near_close.py', 'tests/test_conditional_roi.py', '.github/workflows/nexus.yml']
  workflow_run:
    workflows: ['daily-keirin-predict', 'intraday-keirin-odds', 'quick-keirin-results', 'settle-keirin-results', 'conditional-trifecta-live']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: nexus-formation-verify
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install numpy==2.4.2 lightgbm==4.7.0 requests
      - name: Validate formation, money and exact model assets
        run: python -m unittest discover -s tests -p 'test_nexus*.py'
      - name: Verify prospective same-budget allocation comparison
        run: python -m unittest discover -s tests -p 'test_conditional_budget_near_close.py'
      - name: Verify frozen eight-ticket forecasts and stake comparison
        run: python -m unittest discover -s tests -p 'test_conditional_roi.py'
      - name: Load the saved model without accessing the restricted data source
        env:
          PYTHONPATH: src
        run: python -c "from nexus_model.engine import Engine; print('Loaded',len(Engine('models/nexus53').models),'verified models')"
  publish-existing-inputs:
    needs: verify
    if: always() && ((github.event_name != 'workflow_run' && needs.verify.result == 'success') || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install numpy==2.4.2 lightgbm==4.7.0 requests
      - name: Publish only from responses already obtained by the existing collectors
        env:
          OMP_NUM_THREADS: '2'
        run: python src/nexus_publish_saved_inputs.py --publish
# The original source API is not called by CI. The owner's PC path remains
# available; this job only consumes successful existing page-response captures.
