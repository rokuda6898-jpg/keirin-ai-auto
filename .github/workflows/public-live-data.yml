name: public-live-data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/public_live.py', '.github/workflows/public-live-data.yml']
  workflow_run:
    workflows: ['daily-keirin-predict', 'intraday-keirin-odds', 'fusion-shadow-live', 'quick-keirin-results', 'settle-keirin-results']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: public-live-data
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh the data feed, without deploying the site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python src/public_live.py
            git add outputs/public_live.json
            git diff --cached --quiet && exit 0
            git commit -m 'Refresh public prediction data without rebuilding site'
            git push origin HEAD:main && exit 0
          done
          exit 1
