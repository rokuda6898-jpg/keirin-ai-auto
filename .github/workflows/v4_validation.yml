name: v4-strict-validation

on:
  workflow_dispatch:
  push:
    paths:
      - "src/validate_v4.py"
      - "src/train_position_from_validation.py"
      - "src/build_history.py"
      - "src/predict.py"
      - "src/race_features.py"
      - "src/settle_results.py"
      - "tests/**"
      - ".github/workflows/v4_validation.yml"

permissions:
  contents: write

concurrency:
  group: keirin-v4-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore strict-validation history cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/history.csv
            data/raw/history_odds.csv
            data/raw/history_trifecta_odds.csv
            data/raw/history_metadata.json
            data/raw/race_cache
          key: keirin-v4-validation-${{ github.run_id }}
          restore-keys: |
            keirin-v4-validation-
            keirin-history-v4-

      - name: Validate source
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -p "test_*.py"

      - name: Build at least 45000 historical races
        env:
          HISTORY_MONTHS_BACK: 72
          HISTORY_MAX_RACES: 50000
          HISTORY_MIN_RACES: 45000
          HISTORY_WORKERS: 12
          WINTICKET_MIN_REQUEST_INTERVAL_SEC: 0.20
        run: |
          python src/build_history.py \
            --months-back "$HISTORY_MONTHS_BACK" \
            --max-races "$HISTORY_MAX_RACES" \
            --min-races "$HISTORY_MIN_RACES" \
            --merge-existing \
            --workers "$HISTORY_WORKERS" \
            --sleep-sec 0 \
            --progress-every 500

      - name: Audit history
        run: |
          python src/audit_history.py --fail-on-leakage

      - name: Validate strict history before cache publish
        id: strict_cache_gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import pandas as pd

          p = Path("data/raw/history.csv")
          races = 0
          if p.exists() and p.stat().st_size:
              df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
              races = int(df["race_id"].nunique())
          ready = races >= 45000
          print(f"races={races}")
          print(f"ready={'true' if ready else 'false'}")
          PY
          echo "strict history races: ${{ steps.strict_cache_gate.outputs.races }}"

      - name: Save validated strict history cache
        if: steps.strict_cache_gate.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw/history.csv
            data/raw/history_odds.csv
            data/raw/history_trifecta_odds.csv
            data/raw/history_metadata.json
            data/raw/race_cache
          key: keirin-v4-validation-${{ github.run_id }}

      - name: Run strict walk-forward validation
        env:
          PYTHONPATH: src
        run: |
          python src/validate_v4.py

      - name: Train validated position models
        env:
          PYTHONPATH: src
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("models/v4_validation_summary.json").read_text())
          raise SystemExit(0 if d.get("target_passed") else 1)
          PY
          then
            python src/train_position_from_validation.py
          else
            echo "strict v4 gate failed; no position model will be promoted"
          fi

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: keirin-v4-validation
          path: |
            models/v4_validation_summary.json
            models/position_models.joblib
            outputs/v4_validation_folds.csv
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Keep V4 publication in its own queue. Staleness is guarded explicitly
      # below, so unrelated repository writers cannot evict this pending job.
      group: keirin-v4-publish
      cancel-in-progress: false

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated artifacts
        uses: actions/download-artifact@v4
        with:
          name: keirin-v4-validation
          path: .

      - name: Publish validation result safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          guarded_paths=(
            src/validate_v4.py
            src/train_position_from_validation.py
            src/build_history.py
            src/predict.py
            src/race_features.py
            src/settle_results.py
            tests
            .github/workflows/v4_validation.yml
            models/v4_validation_summary.json
            models/position_models.joblib
            outputs/v4_validation_folds.csv
          )

          is_stale_against_main() {
            git fetch origin main
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- "${guarded_paths[@]}"; then
              echo "V4 validation became stale while it was running; skip publication."
              git diff --name-only "$GITHUB_SHA" origin/main -- "${guarded_paths[@]}" || true
              return 0
            fi
            return 1
          }

          if is_stale_against_main; then
            exit 0
          fi

          git add models/v4_validation_summary.json models/position_models.joblib outputs/v4_validation_folds.csv || true
          git diff --staged --quiet && exit 0
          git commit -m "Update strict v4 validation"

          for attempt in 1 2 3 4; do
            if is_stale_against_main; then
              echo "A newer relevant revision landed before push; refusing stale V4 overwrite."
              exit 0
            fi
            if git rebase origin/main && git push origin main; then
              exit 0
            fi
            git rebase --abort || true
            echo "V4 publish race: retry $attempt/4"
            sleep $((attempt * 2))
          done
          exit 1
