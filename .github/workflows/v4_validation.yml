name: v4-strict-validation

on:
  workflow_dispatch:
  push:
    paths:
      - "src/validate_v4.py"
      - "src/train_position_from_validation.py"
      - "src/build_history.py"
      - "src/predict.py"
      - "src/race_features.py"
      - "src/settle_results.py"
      - "tests/**"
      - ".github/workflows/v4_validation.yml"

permissions:
  contents: write

concurrency:
  group: keirin-v4-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore strict-validation history cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw/history.csv
            data/raw/history_odds.csv
            data/raw/history_trifecta_odds.csv
            data/raw/history_metadata.json
            data/raw/race_cache
          key: keirin-v4-validation-${{ github.run_id }}
          restore-keys: |
            keirin-v4-validation-
            keirin-history-v4-

      - name: Validate source
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -p "test_*.py"

      - name: Build at least 45000 historical races
        env:
          HISTORY_MONTHS_BACK: 72
          HISTORY_MAX_RACES: 50000
          HISTORY_MIN_RACES: 45000
          HISTORY_WORKERS: 12
          WINTICKET_MIN_REQUEST_INTERVAL_SEC: 0.20
        run: |
          python src/build_history.py \
            --months-back "$HISTORY_MONTHS_BACK" \
            --max-races "$HISTORY_MAX_RACES" \
            --min-races "$HISTORY_MIN_RACES" \
            --merge-existing \
            --workers "$HISTORY_WORKERS" \
            --sleep-sec 0 \
            --progress-every 500

      - name: Audit history
        run: |
          python src/audit_history.py --fail-on-leakage

      - name: Run strict walk-forward validation
        env:
          PYTHONPATH: src
        run: |
          python src/validate_v4.py

      - name: Train validated position models
        env:
          PYTHONPATH: src
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("models/v4_validation_summary.json").read_text())
          raise SystemExit(0 if d.get("target_passed") else 1)
          PY
          then
            python src/train_position_from_validation.py
          else
            echo "strict v4 gate failed; no position model will be promoted"
          fi

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: keirin-v4-validation
          path: |
            models/v4_validation_summary.json
            models/position_models.joblib
            outputs/v4_validation_folds.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Commit validation result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/v4_validation_summary.json models/position_models.joblib outputs/v4_validation_folds.csv || true
          git diff --staged --quiet || git commit -m "Update strict v4 validation"
          for attempt in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
