name: daily-keirin-predict

on:
  workflow_dispatch:
  schedule:
    # 06:45 JST
    - cron: "45 21 * * *"

permissions:
  contents: write

concurrency:
  # Keep the morning prediction in its own queue. Sharing the generic writer
  # queue can cause GitHub to evict a pending daily run when another workflow
  # enters the same concurrency group.
  group: keirin-daily-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore real pre-race learning snapshots
        uses: actions/cache/restore@v4
        with:
          path: data/raw/live_snapshot_history.csv
          key: keirin-live-snapshots-v1-${{ github.run_id }}
          restore-keys: |
            keirin-live-snapshots-v1-

      - name: Restore central history for live features
        id: live_central_history
        uses: actions/cache/restore@v4
        with:
          path: data/raw/history.csv
          key: keirin-central-history-v1-${{ github.run_id }}
          restore-keys: |
            keirin-central-history-v1-

      - name: Restore weekly history fallback for live features
        if: steps.live_central_history.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: data/raw/history.csv
          key: keirin-history-v4-${{ github.run_id }}
          restore-keys: |
            keirin-history-v4-

      - name: Validate live feature history
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          p = Path("data/raw/history.csv")
          if not p.exists() or not p.stat().st_size:
              raise SystemExit("live feature history missing")
          df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
          races = int(df["race_id"].nunique())
          print(f"live feature history races={races}")
          if races < 30000:
              raise SystemExit(f"live feature history too small: {races}")
          PY

      - name: Bootstrap production drift baseline if missing
        run: |
          if [ ! -s models/feature_baseline.json ]; then
            python src/build_production_feature_baseline.py
          fi

      - name: Ingest external data if configured
        env:
          KEIRIN_HISTORY_CSV_URL: ${{ secrets.KEIRIN_HISTORY_CSV_URL }}
          KEIRIN_TODAY_CSV_URL: ${{ secrets.KEIRIN_TODAY_CSV_URL }}
        run: |
          python src/ingest.py

      - name: Fetch today entries if no external today data is configured
        env:
          KEIRIN_TODAY_CSV_URL: ${{ secrets.KEIRIN_TODAY_CSV_URL }}
        run: |
          if [ -z "$KEIRIN_TODAY_CSV_URL" ]; then
            python src/fetch_today_entries.py
          else
            echo "KEIRIN_TODAY_CSV_URL is configured; skip WINTICKET fetch"
          fi

      - name: Capture morning real-feed learning snapshot
        run: |
          python src/live_snapshot_store.py --capture

      - name: Save real pre-race learning snapshots
        if: always() && hashFiles('data/raw/live_snapshot_history.csv') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw/live_snapshot_history.csv
          key: keirin-live-snapshots-v1-${{ github.run_id }}

      - name: Build fallback model only if missing
        env:
          KEIRIN_HISTORY_CSV_URL: ${{ secrets.KEIRIN_HISTORY_CSV_URL }}
        run: |
          if [ -z "$KEIRIN_HISTORY_CSV_URL" ] && [ ! -f models/win_model.joblib ]; then
            python src/build_history.py --months-back 1 --max-races 300 --workers 4
            python src/audit_history.py --fail-on-leakage
            python src/train.py
            python src/update_growth_log.py --kind train
          else
            echo "model exists or external history is configured; skip fallback build"
          fi

      - name: Predict
        env:
          BET_BASE_STAKE_YEN: 100
          BET_MAX_STAKE_YEN: 2000
          BET_DAILY_BUDGET_YEN: 10000
          BET_MAX_SECONDS_TO_CLOSE: 3600
          PREDICTION_STRATEGY_VERSION: near_close_v4_position_20261004
          ODDS_SNAPSHOT_LABEL: near-close snapshot
        run: |
          python src/predict.py

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: keirin-predictions
          path: outputs/
          retention-days: 30

      - name: Commit outputs
        env:
          KEIRIN_HISTORY_CSV_URL: ${{ secrets.KEIRIN_HISTORY_CSV_URL }}
          KEIRIN_TODAY_CSV_URL: ${{ secrets.KEIRIN_TODAY_CSV_URL }}
          BET_BASE_STAKE_YEN: 100
          BET_MAX_STAKE_YEN: 2000
          BET_DAILY_BUDGET_YEN: 10000
          BET_MAX_SECONDS_TO_CLOSE: 3600
          PREDICTION_STRATEGY_VERSION: near_close_v4_position_20261004
          ODDS_SNAPSHOT_LABEL: near-close snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          stage_daily_state() {
            git add outputs models data/raw/today_entries.csv data/raw/today_odds.csv || true
            git diff --staged --quiet || git commit -m "Update keirin predictions"
          }

          regenerate_daily_on_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # Recreate the same source state used by the normal daily path.
            python src/ingest.py
            if [ -z "$KEIRIN_TODAY_CSV_URL" ]; then
              python src/fetch_today_entries.py
            fi

            if [ -z "$KEIRIN_HISTORY_CSV_URL" ] && [ ! -f models/win_model.joblib ]; then
              python src/build_history.py --months-back 1 --max-races 300 --workers 4
              python src/audit_history.py --fail-on-leakage
              python src/train.py
              python src/update_growth_log.py --kind train
            fi

            python src/predict.py
            stage_daily_state
          }

          stage_daily_state

          # Never rebase a generated prediction snapshot over newer main.
          # If manager/results advanced main after checkout, rebuild the
          # prediction from that newest state before publishing.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main advanced since daily checkout; regenerating on latest main"
            regenerate_daily_on_latest_main
          fi

          for attempt in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            echo "daily push race: regenerate from latest main retry $attempt/4"
            regenerate_daily_on_latest_main
            sleep $((attempt * 2))
          done
          exit 1
