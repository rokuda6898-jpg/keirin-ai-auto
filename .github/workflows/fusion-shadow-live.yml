name: fusion-shadow-live

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["daily-keirin-predict"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: keirin-fusion-shadow-live
  cancel-in-progress: false

jobs:
  forecast:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore current validated history
        id: history
        uses: actions/cache/restore@v4
        with:
          path: data/raw/history.csv
          key: keirin-central-history-v1-${{ github.run_id }}
          restore-keys: |
            keirin-central-history-v1-
      - name: Validate central history and clear incomplete copies
        id: central_gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import pandas as pd
          p = Path('data/raw/history.csv')
          races = int(pd.read_csv(p, usecols=['race_id'], dtype={'race_id': str}).race_id.nunique()) if p.exists() else 0
          usable = races >= 30000
          print(f'races={races}')
          print(f'usable={str(usable).lower()}')
          if not usable and p.exists():
              p.unlink()
          PY
      - name: Restore strict history when central history is incomplete
        if: steps.central_gate.outputs.usable != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/history.csv
            data/raw/history_odds.csv
            data/raw/history_trifecta_odds.csv
            data/raw/history_metadata.json
            data/raw/race_cache
          key: keirin-v4-validation-${{ github.run_id }}
          restore-keys: |
            keirin-v4-validation-
      - name: Require a sufficiently complete archive
        if: steps.central_gate.outputs.usable != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          p = Path('data/raw/history.csv')
          races = int(pd.read_csv(p, usecols=['race_id'], dtype={'race_id': str}).race_id.nunique()) if p.exists() else 0
          print(f'validated training races={races}')
          if races < 30000:
              raise SystemExit('history archive below the 30000-race minimum')
          PY
      - name: Refit weekly when needed
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import date, datetime
          from pathlib import Path
          import json
          from zoneinfo import ZoneInfo
          from fusion_shadow_live import MANIFEST, source_hashes
          needed = True
          if MANIFEST.exists():
              try:
                  m = json.loads(MANIFEST.read_text(encoding='utf-8'))
                  today = datetime.now(ZoneInfo('Asia/Tokyo')).date()
                  age = (today - date.fromisoformat(m['training_cutoff_exclusive'])).days
                  needed = m.get('source_hashes') != source_hashes() or age >= 7
              except Exception:
                  needed = True
          print(f'needed={str(needed).lower()}')
          PY
          if grep -q '^needed=true$' "$GITHUB_OUTPUT"; then
            python src/fusion_shadow_live.py --stage train
          else
            echo 'recent verified shadow model is still current'
          fi
      - name: Refresh close-window entries and market snapshots
        run: python src/fetch_upcoming_entries.py --min-minutes 5 --max-minutes 240
      - name: Freeze separate shadow predictions and update outcomes
        env:
          PYTHONPATH: src
        run: python src/fusion_shadow_live.py --stage forecast
      - name: Publish only the shadow model and its report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f models/fusion_shadow_refit_first_anchor.joblib
          git add models/fusion_shadow_refit_first_anchor.json outputs/company/fusion_shadow_live_ledger.jsonl outputs/company/fusion_shadow_live_predictions.json outputs/company/fusion_shadow_live_report.json outputs/company/fusion_shadow_live_report.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update isolated fusion shadow forecasts and results'
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:main; then
              echo 'shadow forecast published'
              exit 0
            fi

            echo "main advanced during shadow publish; reconciling attempt $attempt/8"
            git fetch origin main
            remote_ledger="$RUNNER_TEMP/fusion-shadow-remote-ledger.jsonl"
            git show origin/main:outputs/company/fusion_shadow_live_ledger.jsonl > "$remote_ledger" 2>/dev/null || : > "$remote_ledger"
            git merge --no-edit -X ours origin/main
            PYTHONPATH=src python src/fusion_shadow_live.py --stage merge --remote-ledger "$remote_ledger"
            git add -f models/fusion_shadow_refit_first_anchor.joblib
            git add models/fusion_shadow_refit_first_anchor.json outputs/company/fusion_shadow_live_ledger.jsonl outputs/company/fusion_shadow_live_predictions.json outputs/company/fusion_shadow_live_report.json outputs/company/fusion_shadow_live_report.html
            if ! git diff --cached --quiet; then
              git commit -m 'Reconcile isolated fusion shadow ledger'
            fi
          done
          echo 'shadow forecast publish failed after bounded retries'
          exit 1

