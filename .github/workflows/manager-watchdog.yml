name: keirin-manager-watchdog

on:
  workflow_dispatch:
  schedule:
    # Sole automatic scheduler for the manager, once per five minutes.
    # It checks in-progress and pending runs before dispatching a replacement.
    - cron: "*/5 22-23,0-13 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: keirin-manager-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check manager health and recover failed/stalled run
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = "site-manager.yml";
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id, branch: "main", per_page: 10
            });
            const runs = data.workflow_runs || [];
            const now = Date.now();
            const running = runs.find(r => r.status === "in_progress");
            const pending = runs.find(r => ["queued", "pending", "waiting"].includes(r.status));
            const latest = runs[0];
            const dispatch = async reason => {
              core.warning(reason);
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id, ref: "main"
              });
            };

            if (running) {
              const age = (now - new Date(running.created_at).getTime()) / 60000;
              if (age > 35) {
                core.warning("Manager "+running.id+" exceeded 35 minutes; cancelling.");
                try {
                  await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: running.id });
                } catch (error) {
                  core.warning("Cancel request failed: "+error.message);
                }
                if (!pending) await dispatch("Manager stalled with no pending replacement.");
              } else {
                core.info("Manager "+running.id+" is active; age="+age.toFixed(1)+"m, not replacing.");
              }
              return;
            }

            if (pending) {
              core.info("Manager "+pending.id+" already queued; no duplicate dispatch.");
              return;
            }

            if (!latest) {
              await dispatch("No manager run exists.");
              return;
            }

            if (latest.conclusion !== "success") {
              const minutesSinceLastAttempt = (now - new Date(latest.created_at).getTime()) / 60000;
              // Back off persistent failures; a broken source should not
              // create an endless five-minute dispatch and cancellation storm.
              if (minutesSinceLastAttempt < 15) {
                core.info("Latest manager ended "+latest.conclusion+
                          "; failure cooldown "+minutesSinceLastAttempt.toFixed(1)+"m / 15m.");
                return;
              }
              await dispatch("Latest completed manager "+latest.id+" ended "+latest.conclusion+
                             "; retry after failure cooldown");
              return;
            }

            const ageMinutes = (now - new Date(latest.created_at).getTime()) / 60000;
            if (ageMinutes > 18) {
              await dispatch("Last manager completed "+ageMinutes.toFixed(1)+"m ago.");
              return;
            }

            // Run success alone cannot certify healthy prediction outputs.
            try {
              const { data: file } = await github.rest.repos.getContent({
                owner, repo, path: "outputs/manager_status.json", ref: "main"
              });
              const health = JSON.parse(Buffer.from(file.content, "base64").toString("utf8"));
              const stamp = Date.parse(health.checked_at_jst || "");
              const stateAge = (now - stamp) / 60000;
              if (health.status === "unhealthy" || !Number.isFinite(stateAge) || stateAge > 25) {
                await dispatch("Manager run green but health "+health.status+" age="+stateAge.toFixed(1)+"m");
                return;
              }
              core.info("Verified manager run and application health: "+health.status);
            } catch (error) {
              await dispatch("Persisted manager health unreadable: "+error.message);
            }
