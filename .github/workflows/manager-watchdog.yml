name: keirin-manager-watchdog

on:
  workflow_dispatch:
  schedule:
    # Independent supervisor. Offset from the manager so it can detect a missed
    # or failed manager cycle instead of sharing the same execution path.
    - cron: "5,25,45 22-23,0-13 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: keirin-manager-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check manager health and recover failed/stalled run
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = "site-manager.yml";
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id, branch: "main", per_page: 10
            });
            const runs = data.workflow_runs || [];
            const now = Date.now();
            const latest = runs[0];

            if (!latest) {
              core.warning("No manager run found; dispatching one.");
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id, ref: "main"
              });
              return;
            }

            const ageMinutes = (now - new Date(latest.created_at).getTime()) / 60000;
            const updatedAgeMinutes = (now - new Date(latest.updated_at).getTime()) / 60000;
            core.info(`latest manager run=${latest.id} status=${latest.status} conclusion=${latest.conclusion} age=${ageMinutes.toFixed(1)}m updated=${updatedAgeMinutes.toFixed(1)}m`);

            if (latest.status === "completed" && latest.conclusion !== "success") {
              core.warning("Manager failed; rerunning failed jobs.");
              await github.rest.actions.reRunWorkflowFailedJobs({
                owner, repo, run_id: latest.id
              });
              return;
            }

            if (latest.status !== "completed" && updatedAgeMinutes > 12) {
              core.warning("Manager appears stalled; cancelling it before dispatching the newest code.");
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner, repo, run_id: latest.id
                });
              } catch (e) {
                core.warning(`cancel failed for run ${latest.id}: ${e.message}`);
              }
              // Give GitHub a moment to release the shared writer concurrency lock.
              await new Promise(resolve => setTimeout(resolve, 5000));
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id, ref: "main"
              });
              return;
            }

            if (ageMinutes > 18) {
              core.warning("Manager heartbeat is stale; dispatching a fresh run.");
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id, ref: "main"
              });
              return;
            }

            core.info("Manager heartbeat healthy.");
