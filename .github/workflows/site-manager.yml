name: keirin-site-manager

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".gitignore"
      - ".github/workflows/site-manager.yml"
  schedule:
    # Every 5 minutes during the active Japanese racing window.
    - cron: "*/5 22-23,0-13 * * *"

permissions:
  contents: write

concurrency:
  group: keirin-repo-writer
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run manager and self-repair
        run: python src/site_manager.py
      - name: Persist repaired outputs and health status
        # Publication gate: if the manager exits unhealthy, never commit the
        # damaged raw snapshot or generated outputs.
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs data/raw || true
          git diff --staged --quiet || git commit -m "Manager: repair and audit keirin data"
          # Another writer can finish after this run checked out main. Rebase
          # generated outputs is conflict-prone, so refresh and regenerate once
          # against the newest main before pushing.
          if ! git pull --rebase; then
            git rebase --abort || true
            git reset --hard origin/main
            python src/site_manager.py
            # The manager must exit successfully again after resetting to the
            # newest main before any regenerated state is staged.
            git add outputs data/raw || true
            git diff --staged --quiet || git commit -m "Manager: repair and audit keirin data"
          fi
          for attempt in 1 2 3 4; do
            git push && exit 0
            echo "manager push race: retry $attempt/4"
            git fetch origin main
            git rebase origin/main && continue
            git rebase --abort || true
            git reset --hard origin/main
            python src/site_manager.py
            git add outputs data/raw || true
            git diff --staged --quiet || git commit -m "Manager: repair and audit keirin data"
          done
          exit 1