name: keirin-site-manager

on:
  workflow_dispatch:
  # The independent watchdog is the sole automatic scheduler. No direct
  # cron here: every scheduled run can replace an older pending run.

permissions:
  contents: write
  actions: write

concurrency:
  # A single dispatch at a time is enforced by the watchdog's run-state checks.
  # Preserve an active recovery instead of cancelling it for a newer request.
  group: keirin-site-manager-picks-v5
  # GitHub can replace a pending run even with cancel-in-progress=false.
  # The watchdog avoids competing dispatches while any run is active/pending.
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore central history for manager repairs
        id: manager_central_history
        uses: actions/cache/restore@v4
        with:
          path: data/raw/history.csv
          key: keirin-central-history-v1-${{ github.run_id }}
          restore-keys: |
            keirin-central-history-v1-

      - name: Validate restored central history
        id: manager_central_gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import pandas as pd

          p = Path("data/raw/history.csv")
          races = 0
          usable = False
          if p.exists() and p.stat().st_size:
              try:
                  df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
                  races = int(df["race_id"].nunique())
                  usable = races >= 30000
              except Exception as exc:
                  print(f"central history validation failed: {exc}")
          print(f"races={races}")
          print(f"usable={'true' if usable else 'false'}")
          if not usable and p.exists():
              p.unlink()
              print(f"removed undersized central history races={races}")
          PY
          echo "restored central races: ${{ steps.manager_central_gate.outputs.races }}"

      - name: Restore strict validation history fallback
        id: manager_strict_history
        if: steps.manager_central_gate.outputs.usable != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/history.csv
            data/raw/history_odds.csv
            data/raw/history_trifecta_odds.csv
            data/raw/history_metadata.json
            data/raw/race_cache
          key: keirin-v4-validation-${{ github.run_id }}
          restore-keys: |
            keirin-v4-validation-

      - name: Validate strict validation history fallback
        id: manager_strict_gate
        if: steps.manager_central_gate.outputs.usable != 'true'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import pandas as pd

          p = Path("data/raw/history.csv")
          races = 0
          usable = False
          if p.exists() and p.stat().st_size:
              try:
                  df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
                  races = int(df["race_id"].nunique())
                  usable = races >= 30000
              except Exception as exc:
                  print(f"strict fallback validation failed: {exc}")
          print(f"races={races}")
          print(f"usable={'true' if usable else 'false'}")
          if not usable and p.exists():
              p.unlink()
              print(f"removed undersized strict fallback races={races}")
          PY

      - name: Restore weekly history fallback
        if: steps.manager_central_gate.outputs.usable != 'true' && steps.manager_strict_gate.outputs.usable != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/history.csv
            data/raw/history_odds.csv
            data/raw/history_trifecta_odds.csv
            data/raw/history_metadata.json
            data/raw/race_cache
          key: keirin-history-v4-${{ github.run_id }}
          restore-keys: |
            keirin-history-v4-

      - name: Validate final live feature history
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          p = Path("data/raw/history.csv")
          if not p.exists() or not p.stat().st_size:
              raise SystemExit("validated history fallback missing")
          df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
          races = int(df["race_id"].nunique())
          print(f"validated live feature history races={races}")
          if races < 30000:
              raise SystemExit(f"validated history still too small: {races}")
          PY

      - name: Run manager and self-repair
        run: python src/site_manager.py
      - name: Preserve central history across manager git resets
        run: |
          cp data/raw/history.csv /tmp/manager_history.csv
          python src/preserve_validation.py save /tmp/manager_validation

      - name: Persist repaired outputs and health status
        # Publication gate: if the manager exits unhealthy, never commit the
        # damaged raw snapshot or generated outputs.
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          stage_manager_state() {
            python src/reconcile_position_experiment.py || return 2
            python src/release_guard.py || return 2
            git add outputs data/raw || return 2
            git diff --staged --quiet || git commit -m "Manager: repair and audit keirin data"
          }

          merge_latest_main() {
            git fetch origin main || return 2
            if [ "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)" ]; then
              python src/release_guard.py
              return $?
            fi
            # Generated prediction/site outputs are the payload of this run.
            # Merge concurrent result/settlement commits instead of rebuilding
            # the full model against every moving main revision.
            git merge --no-edit -X ours origin/main || return 2
            python src/reconcile_position_experiment.py --ref origin/main || return 2
            python src/release_guard.py || return 2
            git add outputs/company/annual_position_* outputs/company/annual_equation_* outputs/company/annual_fusion_* || return 2
            git diff --staged --quiet || git commit -m "Manager: reconcile prospective position evidence"
          }

          stage_manager_state || exit 2
          merge_latest_main || exit 2

          for attempt in 1 2 3 4; do
            python src/release_guard.py || exit 2
            git push origin HEAD:main && exit 0
            echo "manager push race: merge latest main retry $attempt/4"
            merge_latest_main || exit 2
            sleep $((attempt * 2))
          done
          exit 1

      - name: Publish repaired prediction data without rebuilding the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A recovery started by deployment verification may exceed the
          # workflow_run chaining limit. Explicit dispatch publishes its repair.
          if python -c "import json,sys; sys.exit(0 if json.load(open('outputs/manager_status.json')).get('repaired') else 1)"; then
            gh workflow run public-live-data.yml --ref main
          fi
