name: keirin-site-manager

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".gitignore"
      - ".github/workflows/site-manager.yml"
  schedule:
    # Every 5 minutes during the active Japanese racing window.
    - cron: "*/5 22-23,0-13 * * *"

permissions:
  contents: write

concurrency:
  # Keep the manager independent from the shared writer pending queue.
  # Only manager runs compete with each other; the latest pending cycle may
  # replace an older pending cycle without being evicted by settle/daily jobs.
  group: keirin-site-manager
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore central history for manager repairs
        id: manager_central_history
        uses: actions/cache/restore@v4
        with:
          path: data/raw/history.csv
          key: keirin-central-history-v1-${{ github.run_id }}
          restore-keys: |
            keirin-central-history-v1-

      - name: Validate central manager-history candidate
        id: manager_central_gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import pandas as pd

          p = Path("data/raw/history.csv")
          races = 0
          if p.exists() and p.stat().st_size:
              try:
                  df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
                  races = int(df["race_id"].nunique())
              except Exception as exc:
                  print(f"central manager-history validation failed: {exc}")
          usable = races >= 30000
          if not usable and p.exists():
              p.unlink()
              print(f"removed undersized manager central cache: races={races}")
          print(f"usable={'true' if usable else 'false'}")
          print(f"races={races}")
          PY

      - name: Restore strict-validation history for manager repairs
        id: manager_strict_history
        if: steps.manager_central_gate.outputs.usable != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/history.csv
            data/raw/history_odds.csv
            data/raw/history_trifecta_odds.csv
            data/raw/history_metadata.json
            data/raw/race_cache
          key: keirin-v4-validation-${{ github.run_id }}
          restore-keys: |
            keirin-v4-validation-

      - name: Validate strict manager-history candidate
        id: manager_strict_gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import pandas as pd

          p = Path("data/raw/history.csv")
          races = 0
          if p.exists() and p.stat().st_size:
              try:
                  df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
                  races = int(df["race_id"].nunique())
              except Exception as exc:
                  print(f"strict manager-history validation failed: {exc}")
          usable = races >= 30000
          if not usable and p.exists():
              p.unlink()
              print(f"removed undersized manager strict cache: races={races}")
          print(f"usable={'true' if usable else 'false'}")
          print(f"races={races}")
          PY

      - name: Restore weekly history fallback for manager repairs
        if: steps.manager_strict_gate.outputs.usable != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/history.csv
            data/raw/history_odds.csv
            data/raw/history_trifecta_odds.csv
            data/raw/history_metadata.json
            data/raw/race_cache
          key: keirin-history-v4-${{ github.run_id }}
          restore-keys: |
            keirin-history-v4-

      - name: Validate manager repair history
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          p = Path("data/raw/history.csv")
          if not p.exists() or not p.stat().st_size:
              raise SystemExit("manager repair history missing after all fallbacks")
          df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
          races = int(df["race_id"].nunique())
          print(f"manager repair history races={races}")
          if races < 30000:
              raise SystemExit(f"manager repair history too small after all fallbacks: {races}")
          PY

      - name: Bootstrap production drift baseline if missing
        run: |
          if [ ! -s models/feature_baseline.json ]; then
            python src/build_production_feature_baseline.py
          fi

      - name: Run manager and self-repair
        run: python src/site_manager.py
      - name: Preserve central history across manager git resets
        run: |
          cp data/raw/history.csv /tmp/manager_history.csv

      - name: Persist repaired outputs and health status
        # Publication gate: if the manager exits unhealthy, never commit the
        # damaged raw snapshot or generated outputs.
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          stage_manager_state() {
            git add outputs data/raw models/feature_baseline.json || true
            git diff --staged --quiet || git commit -m "Manager: repair and audit keirin data"
          }

          regenerate_on_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            # reset/clean removes the cache-mounted untracked history file.
            # Restore it from the preserved copy before any repair can rerun
            # prediction, otherwise live prior/Elo/H2H features disappear.
            if [ -s /tmp/manager_history.csv ]; then
              mkdir -p data/raw
              cp /tmp/manager_history.csv data/raw/history.csv
            fi
            if [ ! -s models/feature_baseline.json ] && [ -s data/raw/history.csv ]; then
              python src/build_production_feature_baseline.py
            fi
            python src/site_manager.py
            stage_manager_state
          }

          stage_manager_state

          # Never rebase generated manager state over a newer repository state.
          # If main moved since checkout, rebuild from that newest main first.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main advanced since checkout; regenerating manager state on latest main"
            regenerate_on_latest_main
          fi

          for attempt in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            echo "manager push race: regenerate from latest main retry $attempt/4"
            regenerate_on_latest_main
            sleep $((attempt * 2))
          done
          exit 1