name: graded-tactics
on:
  workflow_dispatch:
  push:
    branches: [codex/graded-retrospective]
    paths: ['src/graded_tactics_backtest.py', 'src/graded_tactics.py', 'tests/test_graded_tactics.py', '.github/workflows/graded-tactics.yml']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_graded*.py'
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/history.csv
          key: keirin-central-history-v1-37948350612
          fail-on-cache-miss: true
      - run: python src/graded_tactics_backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graded-tactics-${{ github.run_id }}
          path: research/graded_tactics/
          retention-days: 30
