name: annual-department-forecast

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/annual_knowledge.py"
      - "src/department_position_experiment.py"
      - "src/position_market.py"
      - "src/betting_logic.py"
      - "src/high_payout_strategy.py"
      - ".github/workflows/annual-department-forecast.yml"
  schedule:
    - cron: "15,45 22-23,0-14 * * *"

permissions:
  contents: write

concurrency:
  group: keirin-annual-department-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/history.csv
          key: keirin-central-history-v1-${{ github.run_id }}
          restore-keys: |
            keirin-central-history-v1-
      - name: Verify archive before using specialist history
        run: |
          python - <<'PY'
          import pandas as pd
          races = pd.read_csv("data/raw/history.csv", usecols=["race_id"], dtype={"race_id": str}).race_id.nunique()
          print(f"validated specialist archive races={races}")
          if races < 30000:
              raise SystemExit("specialist archive below required 30000 races")
          PY
      - name: Fetch fresh entries and create independent year-based proposals
        run: |
          python src/fetch_upcoming_entries.py --min-minutes 5 --max-minutes 240
          python src/annual_knowledge.py
      - uses: actions/upload-artifact@v4
        with:
          name: annual-department-${{ github.run_id }}
          path: outputs/company/annual_*
          retention-days: 30
      - name: Preserve frozen evidence and publish annual reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python src/preserve_validation.py save /tmp/annual_validation
          cp outputs/company/annual_department_predictions.json /tmp/annual_predictions.json
          publish_reports() {
            git add outputs/company/annual_* outputs/company/verified_live_audit.json
            if [ -f outputs/company/rider_official_observations.csv ]; then
              git add outputs/company/rider_official_observations.csv
            fi
            git diff --staged --quiet || git commit -m "Update rolling-year specialist forecasts and validation"
          }
          publish_reports
          for attempt in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git reset --hard origin/main
            python src/preserve_validation.py restore /tmp/annual_validation
            cp /tmp/annual_predictions.json outputs/company/annual_department_predictions.json
            # Keep the original pre-close evidence rather than inventing a new
            # timestamp after results. Reconcile it with the newest results.
            python -c "from annual_knowledge import audit_department_predictions; audit_department_predictions()"
            publish_reports
          done
          exit 1
        env:
          PYTHONPATH: src

