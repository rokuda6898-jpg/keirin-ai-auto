name: quick-keirin-results

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/settle_results.py"
      - "src/nexus_results_sync.py"
      - "src/quick_results_retry.py"
      - "src/nexus_model/budget.py"
      - "src/official_outcomes.py"
      - "src/site_manager.py"
      - ".github/workflows/quick-results.yml"
  schedule:
    # JST 09:00-23:59. Keep the public "確定" label close to the official result.
    - cron: "*/5 0-14 * * *"

permissions:
  contents: write

concurrency:
  # Keep rapid result refreshes independent from the shared repository-writer
  # queue. GitHub retains only one pending run per concurrency group, so sharing
  # that group can evict a waiting result refresh when settle/manager starts.
  # Push races reuse captured results against latest main without another fetch.
  group: keirin-quick-results-writer
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh official results only
        run: |
          refresh_today_if_needed() {
            if python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import pandas as pd

          p = Path("data/raw/today_entries.csv")
          if not p.exists() or not p.stat().st_size:
              raise SystemExit(1)
          try:
              df = pd.read_csv(p, dtype={"race_id": str})
          except Exception:
              raise SystemExit(1)
          if df.empty or not {"date", "source_url", "race_id"}.issubset(df.columns):
              raise SystemExit(1)
          today = datetime.now(ZoneInfo("Asia/Tokyo")).strftime("%Y-%m-%d")
          if not df["date"].astype(str).eq(today).all():
              raise SystemExit(1)
          if df["source_url"].fillna("").astype(str).str.len().eq(0).any():
              raise SystemExit(1)
          print({"today_entries_races": int(df["race_id"].nunique()), "refresh_needed": False})
          PY
            then
              return 0
            fi
            echo "today_entries missing/stale; rebuilding once"
            python src/fetch_today_entries.py
          }

          refresh_today_if_needed
          python src/settle_results.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("outputs/latest_results.json")
          rows=json.loads(p.read_text(encoding="utf-8"))
          decided=sum(1 for x in rows if x.get("official_result_available") and x.get("actual_trifecta"))
          print({"result_rows":len(rows),"official_decided":decided})
          PY

      - name: Publish result JSON immediately
        env:
          QUICK_RESULTS_CACHE: ${{ runner.temp }}/keirin-quick-results-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          stage_result_outputs() {
            git add outputs/latest_results.json outputs/index.html outputs/manager_post_settlement_status.json
            if [ -d data/raw/nexus_page_snapshots ]; then
              git add -f -- data/raw/nexus_page_snapshots
            fi
            for result_path in outputs/company/rider_official_observations.csv outputs/nexus_live.json outputs/nexus_forecasts outputs/nexus_results_sync_status.json; do
              if [ -e "$result_path" ]; then
                git add -- "$result_path"
              fi
            done
          }
          # Keep the source observations outside the runner checkout so a
          # concurrent prediction update never makes us fetch every race again.
          python src/quick_results_retry.py snapshot --cache "$QUICK_RESULTS_CACHE"
          stage_result_outputs
          git diff --cached --quiet && exit 0
          git commit -m "Quick refresh official keirin results"
          # fetch_today_entries.py may leave data/raw changes that this
          # result-only workflow must never publish except the exact source
          # snapshots above. Clear the remaining changes before rebase;
          # otherwise git rebase refuses a dirty worktree and enters a slow
          # refetch loop.
          git reset --hard HEAD
          git clean -fd

          for attempt in 1 2 3 4; do
            git fetch --no-tags origin main
            if git rebase origin/main && git push origin main; then
              exit 0
            fi
            git rebase --abort || true
            if [ "$attempt" -eq 4 ]; then
              break
            fi
            git reset --hard origin/main
            echo "Result publication raced with another update; reusing captured results on latest main"
            python src/quick_results_retry.py replay --cache "$QUICK_RESULTS_CACHE"
            stage_result_outputs
            git diff --cached --quiet && exit 0
            git commit -m "Quick refresh official keirin results"
            git reset --hard HEAD
            git clean -fd
            sleep $((attempt * 2))
          done
          exit 1

