name: intraday-keirin-odds

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes from 07:00 through 22:59 JST.
    - cron: "0,30 0-13,22-23 * * *"

permissions:
  contents: write

concurrency:
  # Keep near-close prediction refreshes in their own queue. A newer intraday
  # cycle may wait behind the active one, but unrelated settle/daily runs can no
  # longer evict it from a shared pending slot.
  group: keirin-intraday-odds
  cancel-in-progress: false

jobs:
  predict-near-close:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore real pre-race learning snapshots
        uses: actions/cache/restore@v4
        with:
          path: data/raw/live_snapshot_history.csv
          key: keirin-live-snapshots-v1-${{ github.run_id }}
          restore-keys: |
            keirin-live-snapshots-v1-

      - name: Restore central history for live features
        id: live_central_history
        uses: actions/cache/restore@v4
        with:
          path: data/raw/history.csv
          key: keirin-central-history-v1-${{ github.run_id }}
          restore-keys: |
            keirin-central-history-v1-

      - name: Validate restored central history
        id: live_central_gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import pandas as pd

          p = Path("data/raw/history.csv")
          races = 0
          usable = False
          if p.exists() and p.stat().st_size:
              try:
                  df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
                  races = int(df["race_id"].nunique())
                  usable = races >= 30000
              except Exception as exc:
                  print(f"central history validation failed: {exc}")
          print(f"races={races}")
          print(f"usable={'true' if usable else 'false'}")
          if not usable and p.exists():
              p.unlink()
              print(f"removed undersized central history races={races}")
          PY
          echo "restored central races: ${{ steps.live_central_gate.outputs.races }}"

      - name: Restore strict validation history fallback
        id: live_strict_history
        if: steps.live_central_gate.outputs.usable != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/history.csv
            data/raw/history_odds.csv
            data/raw/history_trifecta_odds.csv
            data/raw/history_metadata.json
            data/raw/race_cache
          key: keirin-v4-validation-${{ github.run_id }}
          restore-keys: |
            keirin-v4-validation-

      - name: Validate strict validation history fallback
        id: live_strict_gate
        if: steps.live_central_gate.outputs.usable != 'true'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import pandas as pd

          p = Path("data/raw/history.csv")
          races = 0
          usable = False
          if p.exists() and p.stat().st_size:
              try:
                  df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
                  races = int(df["race_id"].nunique())
                  usable = races >= 30000
              except Exception as exc:
                  print(f"strict fallback validation failed: {exc}")
          print(f"races={races}")
          print(f"usable={'true' if usable else 'false'}")
          if not usable and p.exists():
              p.unlink()
              print(f"removed undersized strict fallback races={races}")
          PY

      - name: Restore weekly history fallback
        if: steps.live_central_gate.outputs.usable != 'true' && steps.live_strict_gate.outputs.usable != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/history.csv
            data/raw/history_odds.csv
            data/raw/history_trifecta_odds.csv
            data/raw/history_metadata.json
            data/raw/race_cache
          key: keirin-history-v4-${{ github.run_id }}
          restore-keys: |
            keirin-history-v4-

      - name: Validate final live feature history
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          p = Path("data/raw/history.csv")
          if not p.exists() or not p.stat().st_size:
              raise SystemExit("validated history fallback missing")
          df = pd.read_csv(p, usecols=["race_id"], dtype={"race_id": str})
          races = int(df["race_id"].nunique())
          print(f"validated live feature history races={races}")
          if races < 30000:
              raise SystemExit(f"validated history still too small: {races}")
          PY

      - name: Fetch races near close
        id: upcoming
        run: |
          python src/fetch_upcoming_entries.py --min-minutes 5 --max-minutes 40
          echo "count=$(cat data/raw/upcoming_races_count.txt)" >> "$GITHUB_OUTPUT"

      - name: Predict with near-close odds
        if: steps.upcoming.outputs.count != '0'
        env:
          BET_BASE_STAKE_YEN: 100
          BET_MAX_STAKE_YEN: 2000
          BET_DAILY_BUDGET_YEN: 10000
          BET_MAX_SECONDS_TO_CLOSE: 2400
          PREDICTION_SNAPSHOT_MODE: true
          PREDICTION_STRATEGY_VERSION: near_close_v4_position_20261004
          ODDS_SNAPSHOT_LABEL: 5-40 minutes before close
        run: |
          python src/predict.py

      - name: Upload snapshot
        if: steps.upcoming.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: keirin-near-close-${{ github.run_id }}
          path: outputs/
          retention-days: 30

      - name: Commit snapshot
        if: steps.upcoming.outputs.count != '0'
        env:
          BET_BASE_STAKE_YEN: 100
          BET_MAX_STAKE_YEN: 2000
          BET_DAILY_BUDGET_YEN: 10000
          BET_MAX_SECONDS_TO_CLOSE: 2400
          PREDICTION_SNAPSHOT_MODE: true
          PREDICTION_STRATEGY_VERSION: near_close_v4_position_20261004
          ODDS_SNAPSHOT_LABEL: 5-40 minutes before close
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -s data/raw/history.csv ]; then
            cp data/raw/history.csv /tmp/intraday_history.csv
          fi

          stage_intraday_state() {
            git add outputs data/raw/today_entries.csv data/raw/today_odds.csv || true
            git diff --staged --quiet || git commit -m "Add near-close keirin snapshot"
          }

          regenerate_intraday_on_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            if [ -s /tmp/intraday_history.csv ]; then
              mkdir -p data/raw
              cp /tmp/intraday_history.csv data/raw/history.csv
            fi
            python src/fetch_upcoming_entries.py --min-minutes 5 --max-minutes 40
            if [ "$(cat data/raw/upcoming_races_count.txt)" = "0" ]; then
              echo "No near-close races remain after refresh; nothing stale will be published."
              return 10
            fi

            python src/predict.py
            stage_intraday_state
            return 0
          }

          stage_intraday_state

          # Generated near-close predictions are time-sensitive. Never rebase an
          # older snapshot over a newer main; regenerate from the latest source
          # state instead.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main advanced since intraday checkout; regenerating on latest main"
            if regenerate_intraday_on_latest_main; then
              :
            else
              rc=$?
              [ "$rc" -eq 10 ] && exit 0
              exit "$rc"
            fi
          fi

          for attempt in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            echo "intraday push race: regenerate from latest main retry $attempt/4"
            if regenerate_intraday_on_latest_main; then
              :
            else
              rc=$?
              [ "$rc" -eq 10 ] && exit 0
              exit "$rc"
            fi
            sleep $((attempt * 2))
          done

          echo "Failed to publish fresh prediction after 4 push retries" >&2
          exit 1
